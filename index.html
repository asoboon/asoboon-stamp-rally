<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASOBooN スタンプラリー</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue',
                   'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      background: #fffbe6;
      min-height: 100vh;
      color: #222;
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    /* ── Loading ── */
    #view-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      gap: 20px;
      text-align: center;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 5px solid #ffe082;
      border-top-color: #ff8f00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-msg   { font-size: 15px; color: #555; font-weight: 500; }
    #timeout-msg  {
      font-size: 13px; color: #e65100; background: #fff3e0;
      border: 1px solid #ffcc80; border-radius: 10px;
      padding: 10px 16px; line-height: 1.6;
      display: none;
    }

    /* ── Error ── */
    #view-error {
      display: none;
      margin-top: 48px;
      background: #fff;
      border: 2px solid #ff8a65;
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
    }
    .err-icon { font-size: 44px; margin-bottom: 12px; }
    #error-msg  { font-size: 15px; color: #c62828; font-weight: 700; margin-bottom: 8px; line-height: 1.5; }
    #error-hint { font-size: 13px; color: #888; line-height: 1.6; }

    /* ── Header ── */
    .page-header { text-align: center; margin-bottom: 20px; }
    .page-header h1 {
      font-size: 22px; font-weight: 900;
      color: #e65100; letter-spacing: 0.02em;
    }

    /* ── Count ── */
    .count-wrap { text-align: center; margin-bottom: 20px; }
    .count-wrap p {
      font-size: 17px; color: #333;
    }
    .count-wrap strong { font-size: 36px; color: #ff8f00; font-weight: 900; }

    /* ── Banner ── */
    #banner {
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 14px; font-weight: 700;
      text-align: center;
      display: none;
    }
    .banner-new  { background: #e8f5e9; border: 2px solid #43a047; color: #2e7d32; }
    .banner-dupe { background: #fff8e1; border: 2px solid #ffa726; color: #e65100; }

    /* ── Stamp Grid ── */
    .stamp-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stamp-card {
      background: #fff;
      border: 2px solid #ffe0b2;
      border-radius: 16px;
      padding: 18px 12px 16px;
      text-align: center;
      position: relative;
      transition: border-color .25s, background .25s;
    }
    .stamp-card.stamped {
      background: linear-gradient(145deg, #fff8e1, #fffde7);
      border-color: #ffa726;
    }
    .stamp-card.current { box-shadow: 0 0 0 3px rgba(255,111,0,.25); }
    .stamp-card.new-stamp { animation: pop .45s ease; }
    @keyframes pop {
      0%   { transform: scale(.88); }
      60%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .stamp-mark {
      font-size: 28px; line-height: 1;
      margin-bottom: 6px;
      color: #ffa726;
    }
    .stamp-card:not(.stamped) .stamp-mark { color: #bbb; }
    .stamp-name { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 4px; }
    .stamp-desc { font-size: 10px; color: #999; line-height: 1.5; }
    .stamp-done {
      position: absolute; top: 8px; right: 8px;
      background: #ffa726; color: #fff;
      font-size: 11px; font-weight: 900;
      width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Complete ── */
    #view-complete {
      display: none;
      text-align: center;
      padding: 32px 8px 48px;
    }
    .cmp-emoji {
      font-size: 72px;
      display: block;
      animation: bounce 1.2s ease infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-14px); }
    }
    .cmp-title {
      font-size: 30px; font-weight: 900;
      color: #e65100; margin: 16px 0 10px;
    }
    .cmp-sub {
      font-size: 15px; color: #555; line-height: 1.7; margin-bottom: 28px;
    }
    .cmp-badges {
      display: flex; justify-content: center; gap: 10px;
      flex-wrap: wrap; margin-bottom: 24px;
    }
    .cmp-badge {
      background: linear-gradient(135deg, #ffa726, #ff6f00);
      color: #fff;
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 26px;
      min-width: 64px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .cmp-badge span { font-size: 10px; font-weight: 700; }
    .cmp-note {
      font-size: 12px; color: #aaa;
      background: #f5f5f5; border-radius: 10px;
      padding: 12px 16px; line-height: 1.6;
    }

    /* ── Confetti ── */
    #confetti-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 9999;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Loading -->
  <div id="view-loading">
    <div class="spinner"></div>
    <p id="status-msg">LIFFを起動しています...</p>
    <p id="timeout-msg">
      処理に時間がかかっています。<br>
      ネットワーク状況を確認してください。
    </p>
  </div>

  <!-- Error -->
  <div id="view-error">
    <div class="err-icon">⚠️</div>
    <p id="error-msg"></p>
    <p id="error-hint"></p>
  </div>

  <!-- Main -->
  <div id="view-main" style="display:none">
    <div class="page-header">
      <h1>🎯 ASOBooN スタンプラリー</h1>
    </div>
    <div id="banner"></div>
    <div class="count-wrap">
      <p>今日は <strong id="count">0</strong> / 4 個 あつめたよ</p>
    </div>
    <div class="stamp-grid" id="stamp-grid"></div>
  </div>

  <!-- Complete -->
  <div id="view-complete">
    <span class="cmp-emoji">🎉</span>
    <div class="cmp-title">コンプリート！</div>
    <div class="cmp-sub">
      全4スポットのスタンプを集めました！<br>
      スタッフにこの画面を見せてください。
    </div>
    <div class="cmp-badges" id="cmp-badges"></div>
    <div class="cmp-note">※ スタッフが確認するまでこの画面を閉じないでください。</div>
  </div>

</div>

<canvas id="confetti-canvas"></canvas>

<script>
/* ─── 設定 ─────────────────────────────────────────────────── */
var LIFF_ID    = '2009888671-57TOefc3';
var GAS_URL    = 'https://script.google.com/macros/s/AKfycbxILMUKf0jUEXi_t3quHWUuY0QwP8damcvnKUFY8OwFXoqcN7rfdEhi3vh2Yf8bzLiQLQ/exec';
var TIMEOUT_MS = 12000;

var SPOTS = [
  { id: 'spot_01', name: 'みまもり',   icon: '👀', desc: '保護者の方は必ずお子様の近くにいてください。' },
  { id: 'spot_02', name: '飲食ルール', icon: '🍵', desc: '食べ物は食べられません。飲み物は土足の場所でお願いします。' },
  { id: 'spot_03', name: '順番',       icon: '🙋', desc: '順番や回数を守って遊びましょう。' },
  { id: 'spot_04', name: '入退場',     icon: '🚪', desc: '退場の際はロッカーを空っぽにしてください。' },
];

/* ─── DOM ユーティリティ ───────────────────────────────────── */
function $(id) { return document.getElementById(id); }
function show(id) { $(id).style.display = 'block'; }
function hide(id) { $(id).style.display = 'none';  }

function setStatus(msg) {
  $('status-msg').textContent = msg;
}

function showError(msg, hint) {
  hide('view-loading');
  hide('view-main');
  $('error-msg').textContent  = msg;
  $('error-hint').textContent = hint || '';
  show('view-error');
}

/* ─── spotId 抽出 ─────────────────────────────────────────── */
function extractSpotId() {
  var href   = location.href;
  var search = location.search;
  var hash   = location.hash;

  // 1. ?spot= 直接
  var p1 = new URLSearchParams(search).get('spot');
  if (p1) return p1;

  // 2. liff.state に内包
  var ls = new URLSearchParams(search).get('liff.state');
  if (ls) {
    try {
      var dec = decodeURIComponent(ls);
      var p2  = new URLSearchParams(dec.replace(/^\?/, '')).get('spot');
      if (p2) return p2;
    } catch (_) {}
    var p3 = new URLSearchParams(ls.replace(/^\?/, '')).get('spot');
    if (p3) return p3;
  }

  // 3. hash
  if (hash) {
    var p4 = new URLSearchParams(hash.replace(/^#\??/, '')).get('spot');
    if (p4) return p4;
  }

  // 4. href 全体から正規表現
  var m = href.match(/[?&#]spot=([^&&#\s]+)/);
  if (m) return decodeURIComponent(m[1]);

  return null;
}

/* ─── GAS 呼び出し ────────────────────────────────────────── */
function callGAS(payload) {
  var abort     = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var abortTid  = null;

  var fetchP = fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    signal: abort ? abort.signal : undefined,
  }).then(function(res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  });

  var timeoutP = new Promise(function(_, reject) {
    abortTid = setTimeout(function() {
      if (abort) abort.abort();
      reject(new Error('API_TIMEOUT'));
    }, TIMEOUT_MS);
  });

  return Promise.race([fetchP, timeoutP]).then(function(r) {
    clearTimeout(abortTid);
    return r;
  }, function(e) {
    clearTimeout(abortTid);
    throw e;
  });
}

/* ─── 描画: メイン ────────────────────────────────────────── */
function renderMain(result, spotId) {
  var stamped = {};
  (result.stampList || []).forEach(function(s) {
    if (s.stamped) stamped[s.spotId] = true;
  });

  $('count').textContent = result.stampedCount || 0;

  // バナー
  var banner = $('banner');
  if (spotId && result.currentSpot) {
    var name = result.currentSpot.spotName || spotId;
    if (!result.alreadyStamped) {
      banner.className    = 'banner-new';
      banner.textContent  = '✅ 「' + name + '」のスタンプを獲得！';
    } else {
      banner.className    = 'banner-dupe';
      banner.textContent  = '⚡ 「' + name + '」は今日すでにスタンプ済みです';
    }
    banner.style.display = 'block';
  }

  // スタンプカード
  var grid = $('stamp-grid');
  grid.innerHTML = '';
  SPOTS.forEach(function(spot) {
    var isStamped = !!stamped[spot.id];
    var isCurr    = spot.id === spotId;
    var isNew     = isCurr && !result.alreadyStamped;

    var card = document.createElement('div');
    card.className = 'stamp-card'
      + (isStamped ? ' stamped'   : '')
      + (isCurr   ? ' current'   : '')
      + (isNew    ? ' new-stamp' : '');

    card.innerHTML =
      '<div class="stamp-mark">'  + (isStamped ? '●' : '○')  + '</div>' +
      '<div class="stamp-name">'  + spot.name                  + '</div>' +
      '<div class="stamp-desc">'  + spot.desc                  + '</div>' +
      (isStamped ? '<div class="stamp-done">✓</div>' : '');

    grid.appendChild(card);
  });

  hide('view-loading');
  show('view-main');
}

/* ─── 描画: コンプリート ─────────────────────────────────── */
function renderComplete() {
  var badges = $('cmp-badges');
  badges.innerHTML = '';
  SPOTS.forEach(function(spot) {
    var b = document.createElement('div');
    b.className = 'cmp-badge';
    b.innerHTML = spot.icon + '<span>' + spot.name + '</span>';
    badges.appendChild(b);
  });
  hide('view-loading');
  hide('view-main');
  show('view-complete');
  startConfetti();
}

/* ─── コンフェッティ ────────────────────────────────────── */
function startConfetti() {
  var cv  = $('confetti-canvas');
  var ctx = cv.getContext('2d');
  cv.width  = window.innerWidth;
  cv.height = window.innerHeight;

  var COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff922b','#cc5de8'];
  var pieces = [];
  for (var i = 0; i < 100; i++) {
    pieces.push({
      x: Math.random() * cv.width,
      y: Math.random() * cv.height - cv.height,
      r: Math.random() * 7 + 3,
      c: COLORS[Math.floor(Math.random() * COLORS.length)],
      a: 0, av: Math.random() * .08 + .04,
      vx: Math.random() * 2 - 1,
    });
  }

  var frame = 0;
  var tid = setInterval(function() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    pieces.forEach(function(p) {
      p.a  += p.av;
      p.y  += Math.cos(frame / 18) + 2;
      p.x  += p.vx + Math.sin(frame / 18) * .4;
      ctx.beginPath();
      ctx.fillStyle = p.c;
      ctx.ellipse(p.x, p.y, p.r, p.r * .5, Math.sin(p.a) * .3, 0, 2 * Math.PI);
      ctx.fill();
      if (p.y > cv.height) { p.y = -10; p.x = Math.random() * cv.width; }
    });
    frame++;
    if (frame > 270) {
      clearInterval(tid);
      ctx.clearRect(0, 0, cv.width, cv.height);
    }
  }, 30);
}

/* ─── エラーメッセージ変換 ──────────────────────────────── */
function parseError(err) {
  var code = err.message || '';
  if (code === 'LINE_USER_ID_EMPTY' || code.indexOf('IDENTITY') !== -1) {
    return {
      msg:  'LINEユーザー情報を取得できませんでした。',
      hint: 'LINEアプリ内からアクセスしてください。',
    };
  }
  if (code === 'API_TIMEOUT') {
    return {
      msg:  '通信がタイムアウトしました。',
      hint: 'ネットワーク状況を確認して、もう一度お試しください。',
    };
  }
  if (code === 'LINE_REQUIRED') {
    return {
      msg:  'LINEアプリから開いてください。',
      hint: 'このページはLINEミニアプリ専用です。',
    };
  }
  if (code === 'INVALID_SPOT') {
    return { msg: '無効なスポットIDです。', hint: 'NFCタグを読み直してください。' };
  }
  if (code.indexOf('SAVE_FAILED') !== -1 || code.indexOf('HTTP') !== -1) {
    return { msg: 'サーバーエラーが発生しました。', hint: code };
  }
  return { msg: 'エラーが発生しました。', hint: code };
}

/* ─── メイン処理 ────────────────────────────────────────── */
async function main() {
  var timeoutWarnTid = setTimeout(function() {
    $('timeout-msg').style.display = 'block';
  }, TIMEOUT_MS);

  try {
    // 1. LIFF 初期化
    setStatus('LIFFを起動しています...');
    await liff.init({ liffId: LIFF_ID });

    // 2. ログイン確認
    setStatus('ログイン状態を確認しています...');
    if (!liff.isLoggedIn()) {
      clearTimeout(timeoutWarnTid);
      liff.login({ redirectUri: location.href });
      return;
    }

    // 3. spotId 取得
    var spotId = extractSpotId();

    // 4. ユーザー識別情報取得
    setStatus('LINEユーザーを確認しています...');
    var idToken    = liff.getIDToken() || '';
    var lineUserId = '';

    if (!idToken) {
      try {
        var ctx = liff.getContext();
        lineUserId = (ctx && ctx.userId) ? ctx.userId : '';
      } catch (_) {}

      if (!lineUserId) {
        try {
          var profile = await liff.getProfile();
          lineUserId  = profile.userId || '';
        } catch (_) {}
      }
    }

    if (!idToken && !lineUserId) {
      throw new Error('LINE_USER_ID_EMPTY');
    }

    // 5. GAS API 呼び出し
    if (spotId) {
      setStatus('スタンプを保存しています...');
    } else {
      setStatus('スタンプを確認しています...');
    }

    var payload = {
      action:     spotId ? 'stamp' : 'getStamps',
      spotId:     spotId || '',
      clientUrl:  location.href,
      idToken:    idToken,
      lineUserId: lineUserId,
      timestamp:  new Date().toISOString(),
    };

    var result = await callGAS(payload);
    clearTimeout(timeoutWarnTid);

    if (result.ok === false || result.success === false) {
      var apiErr = new Error(result.error || 'SAVE_FAILED');
      throw apiErr;
    }

    setStatus('保存完了');

    // 6. 描画
    if (result.completed || result.isComplete) {
      renderComplete();
    } else {
      renderMain(result, spotId);
    }

  } catch (err) {
    clearTimeout(timeoutWarnTid);
    console.error('[stamp-rally]', err);
    var parsed = parseError(err);
    showError(parsed.msg, parsed.hint);
  }
}

main();
</script>
</body>
</html>
