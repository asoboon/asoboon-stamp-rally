<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASOBooN スタンプラリー</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: #f5f7ff;
      min-height: 100vh;
      color: #1a1a2e;
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* ─── Loading ─── */
    #view-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      gap: 16px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #dde3ff;
      border-top-color: #4f6ef7;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: #888; }

    /* ─── Error ─── */
    #view-error {
      display: none;
      margin-top: 40px;
      background: #fff5f5;
      border: 1.5px solid #ffb3b3;
      border-radius: 14px;
      padding: 24px;
      text-align: center;
    }
    .error-icon { font-size: 40px; margin-bottom: 12px; }
    .error-msg { font-size: 14px; color: #cc3333; line-height: 1.6; }

    /* ─── Header ─── */
    .page-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .page-header h1 {
      font-size: 20px;
      font-weight: 800;
      color: #3a4de4;
      letter-spacing: 0.02em;
    }
    .page-header p {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    /* ─── Banner ─── */
    .banner {
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      display: none;
    }
    .banner-new  { background: #eaf7ec; border: 1.5px solid #52c068; color: #2a7a3b; }
    .banner-dupe { background: #fffbea; border: 1.5px solid #f5c542; color: #8a6800; }

    /* ─── Progress ─── */
    .progress-wrap {
      text-align: center;
      margin-bottom: 20px;
    }
    .progress-num {
      font-size: 42px;
      font-weight: 900;
      color: #3a4de4;
      line-height: 1;
    }
    .progress-num span { font-size: 20px; color: #aaa; font-weight: 400; }
    .progress-label { font-size: 12px; color: #999; margin-top: 4px; }
    .progress-bar-track {
      height: 8px;
      background: #e0e4ff;
      border-radius: 99px;
      margin-top: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4f6ef7, #a78bfa);
      border-radius: 99px;
      transition: width 0.6s ease;
    }

    /* ─── Stamp Grid ─── */
    .stamp-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stamp-card {
      background: #fff;
      border: 2px solid #e8eaff;
      border-radius: 16px;
      padding: 16px 12px 14px;
      text-align: center;
      position: relative;
      transition: border-color 0.3s, background 0.3s;
    }
    .stamp-card.stamped {
      background: linear-gradient(145deg, #f0fdf4, #ecfdf5);
      border-color: #4ade80;
    }
    .stamp-card.highlight {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    .stamp-card.new-stamp { animation: pop 0.4s ease; }
    @keyframes pop {
      0%   { transform: scale(0.9); }
      60%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .stamp-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      background: #e8eaff;
      color: #6670c8;
      margin-bottom: 8px;
    }
    .stamp-card.stamped .stamp-num { background: #4ade80; color: #fff; }
    .stamp-emoji { font-size: 28px; display: block; margin-bottom: 6px; }
    .stamp-name  { font-size: 13px; font-weight: 700; color: #222; margin-bottom: 4px; }
    .stamp-desc  { font-size: 10px; color: #999; line-height: 1.5; }
    .stamp-check {
      position: absolute;
      top: 8px; right: 8px;
      background: #4ade80;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── Completion ─── */
    #view-complete {
      display: none;
      text-align: center;
      padding: 24px 8px 40px;
    }
    .complete-emoji {
      font-size: 72px;
      animation: bounce 1.2s ease infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-12px); }
    }
    .complete-title {
      font-size: 28px;
      font-weight: 900;
      color: #ff6b00;
      margin: 16px 0 10px;
    }
    .complete-subtitle {
      font-size: 15px;
      color: #555;
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .complete-stamps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }
    .complete-stamp-badge {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      border-radius: 12px;
      padding: 10px 4px;
      font-size: 22px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .complete-stamp-badge span { font-size: 10px; font-weight: 700; }
    .complete-note {
      font-size: 12px;
      color: #aaa;
      background: #f7f7f7;
      border-radius: 10px;
      padding: 12px 16px;
      line-height: 1.6;
    }

    /* ─── Confetti canvas ─── */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Loading -->
  <div id="view-loading">
    <div class="spinner"></div>
    <p class="loading-text">読み込み中...</p>
  </div>

  <!-- Error -->
  <div id="view-error">
    <div class="error-icon">⚠️</div>
    <div class="error-msg" id="error-text"></div>
  </div>

  <!-- Main -->
  <div id="view-main" style="display:none">
    <div class="page-header">
      <h1>🎯 スタンプラリー</h1>
      <p>ASOBooN 全4スポットを回ろう！</p>
    </div>

    <div class="banner" id="banner"></div>

    <div class="progress-wrap">
      <div class="progress-num">
        <span id="count-num">0</span><span> / 4</span>
      </div>
      <div class="progress-label">スタンプ獲得数</div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
      </div>
    </div>

    <div class="stamp-grid" id="stamp-grid"></div>
  </div>

  <!-- Complete -->
  <div id="view-complete">
    <div class="complete-emoji">🎉</div>
    <div class="complete-title">コンプリート！</div>
    <div class="complete-subtitle">
      全4スポットのスタンプを集めました！<br>
      スタッフにこの画面を見せてください。
    </div>
    <div class="complete-stamps" id="complete-stamps"></div>
    <div class="complete-note">
      ※ この画面はスタッフが確認するまで閉じないでください。
    </div>
  </div>

</div>

<canvas id="confetti-canvas"></canvas>

<script>
// ─── Constants ───────────────────────────────────────────────────────────────
const LIFF_ID = '2009888671-57TOefc3';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxILMUKf0jUEXi_t3quHWUuY0QwP8damcvnKUFY8OwFXoqcN7rfdEhi3vh2Yf8bzLiQLQ/exec';

const SPOTS = [
  { id: 'spot_01', name: 'みまもり',   icon: '👀', desc: '保護者の方は必ずお子様の近くにいてください。' },
  { id: 'spot_02', name: '飲食ルール', icon: '🍵', desc: '食べ物は食べられません。飲み物は土足の場所でお願いします。' },
  { id: 'spot_03', name: '順番',       icon: '🙋', desc: '順番や回数を守って遊びましょう。' },
  { id: 'spot_04', name: '入退場',     icon: '🚪', desc: '退場の際はロッカーを空っぽにしてください。' },
];

// ─── DOM helpers ─────────────────────────────────────────────────────────────
function show(id) { document.getElementById(id).style.display = 'block'; }
function hide(id) { document.getElementById(id).style.display = 'none';  }

function showError(msg) {
  hide('view-loading');
  hide('view-main');
  document.getElementById('error-text').textContent = msg;
  show('view-error');
}

// ─── GAS API ─────────────────────────────────────────────────────────────────
async function callGAS(payload) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify(payload),
    // Content-Type を指定しないと text/plain になり CORS preflight が不要
  });
  if (!res.ok) throw new Error('サーバーエラー (HTTP ' + res.status + ')');
  const json = await res.json();
  if (!json.success) throw new Error(json.error || 'APIエラーが発生しました。');
  return json;
}

// ─── Render: main ────────────────────────────────────────────────────────────
function renderMain(result, currentSpotId) {
  const stampedIds = new Set(result.stamps.map(s => s.spotId));
  const count = stampedIds.size;
  const isNew = currentSpotId && result.alreadyStamped === false;

  document.getElementById('count-num').textContent = count;
  document.getElementById('progress-bar').style.width = (count / SPOTS.length * 100) + '%';

  if (currentSpotId) {
    const banner = document.getElementById('banner');
    const spot   = SPOTS.find(s => s.id === currentSpotId);
    const name   = spot ? spot.name : currentSpotId;
    if (isNew) {
      banner.className = 'banner banner-new';
      banner.textContent = '✅ 「' + name + '」のスタンプを獲得しました！';
    } else {
      banner.className = 'banner banner-dupe';
      banner.textContent = '⚡ 「' + name + '」は既にスタンプ済みです';
    }
    banner.style.display = 'block';
  }

  const grid = document.getElementById('stamp-grid');
  grid.innerHTML = '';
  SPOTS.forEach(function(spot, i) {
    const stamped = stampedIds.has(spot.id);
    const isCurr  = spot.id === currentSpotId;
    const card = document.createElement('div');
    card.className = 'stamp-card'
      + (stamped ? ' stamped'    : '')
      + (isCurr  ? ' highlight'  : '')
      + (isCurr && isNew ? ' new-stamp' : '');
    card.innerHTML =
      '<div class="stamp-num">' + (i + 1) + '</div>' +
      '<span class="stamp-emoji">' + (stamped ? spot.icon : '⬜') + '</span>' +
      '<div class="stamp-name">'  + spot.name + '</div>' +
      '<div class="stamp-desc">'  + spot.desc + '</div>' +
      (stamped ? '<div class="stamp-check">✓</div>' : '');
    grid.appendChild(card);
  });

  hide('view-loading');
  show('view-main');
}

// ─── Render: complete ────────────────────────────────────────────────────────
function renderComplete() {
  const badges = document.getElementById('complete-stamps');
  badges.innerHTML = '';
  SPOTS.forEach(function(spot) {
    const b = document.createElement('div');
    b.className = 'complete-stamp-badge';
    b.innerHTML = spot.icon + '<span>' + spot.name + '</span>';
    badges.appendChild(b);
  });

  hide('view-loading');
  hide('view-main');
  show('view-complete');
  startConfetti();
}

// ─── Confetti ────────────────────────────────────────────────────────────────
function startConfetti() {
  var canvas = document.getElementById('confetti-canvas');
  var ctx    = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  var COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff922b','#cc5de8'];
  var pieces = [];
  for (var i = 0; i < 90; i++) {
    pieces.push({
      x:     Math.random() * canvas.width,
      y:     Math.random() * canvas.height - canvas.height,
      r:     Math.random() * 7 + 3,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      tiltA: 0,
      tiltV: Math.random() * 0.08 + 0.04,
      vx:    Math.random() * 2 - 1,
    });
  }

  var frame = 0;
  var tid = setInterval(function() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function(p) {
      p.tiltA += p.tiltV;
      p.y += Math.cos(frame / 18) + 2;
      p.x += p.vx + Math.sin(frame / 18) * 0.4;
      ctx.beginPath();
      ctx.fillStyle = p.color;
      ctx.ellipse(p.x, p.y, p.r, p.r * 0.5, Math.sin(p.tiltA) * 0.2, 0, 2 * Math.PI);
      ctx.fill();
      if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
    });
    frame++;
    if (frame > 240) {
      clearInterval(tid);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }, 30);
}

// ─── Entry point ─────────────────────────────────────────────────────────────
async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: window.location.href });
      return;
    }

    var params = new URLSearchParams(window.location.search);
    var spotId = params.get('spot') || null;

    // idToken 優先、取れなければ userId にフォールバック
    var authPayload = {};
    var idToken = liff.getIDToken();
    if (idToken) {
      authPayload.idToken = idToken;
    } else {
      try {
        var ctx    = liff.getContext();
        var userId = (ctx && ctx.userId) ? ctx.userId : (await liff.getProfile()).userId;
        authPayload.userId = userId;
      } catch (_) {
        throw new Error('ユーザー情報を取得できませんでした。LINEアプリから開き直してください。');
      }
    }

    var payload = Object.assign(
      { action: spotId ? 'stamp' : 'getStamps' },
      spotId ? { spotId: spotId } : {},
      authPayload
    );

    var result = await callGAS(payload);

    if (result.completed) {
      renderComplete();
    } else {
      renderMain(result, spotId);
    }

  } catch (err) {
    console.error(err);
    showError(err.message || '予期せぬエラーが発生しました。');
  }
}

main();
</script>
</body>
</html>
